<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Phillip England</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon/favicon.ico">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #090909;
            color: #e7e0dc;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        body::before {
            content: "Loading";
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            background: #090909;
            color: #2f80ff;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            animation: boot 0.45s ease forwards;
            pointer-events: none;
        }
        @keyframes boot {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }
        main {
            width: min(360px, calc(100% - 2rem));
        }
        h1 {
            margin: 0 0 1rem;
            color: #2f80ff;
            font-size: 1.35rem;
            line-height: 1.1;
        }
        form {
            display: grid;
            gap: 0.8rem;
            padding: 1rem;
            border: 1px solid rgba(47, 128, 255, 0.32);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.045);
        }
        label {
            display: grid;
            gap: 0.35rem;
            color: #b8b8b8;
            font-size: 0.86rem;
        }
        input {
            width: 100%;
            min-height: 2.75rem;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 6px;
            padding: 0.75rem;
            background: #111;
            color: #fff;
            font: inherit;
        }
        input:focus {
            outline: 2px solid rgba(47, 128, 255, 0.55);
            outline-offset: 2px;
        }
        button {
            min-height: 2.75rem;
            border: 1px solid rgba(47, 128, 255, 0.58);
            border-radius: 999px;
            background: #2f80ff;
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
        .error {
            margin: 0;
            padding: 0.7rem 0.8rem;
            border: 1px solid rgba(47, 128, 255, 0.45);
            border-radius: 6px;
            background: rgba(47, 128, 255, 0.1);
            color: #d7e8ff;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <main>
        <h1>Admin Login</h1>
        <form method="post" action="/login">
            {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
            <label>
                Username
                <input type="text" name="username" autocomplete="username" required autofocus>
            </label>
            <label>
                Password
                <input type="password" name="password" autocomplete="current-password" required>
            </label>
            <button type="submit">Log In</button>
        </form>
    </main>
</body>
</html>
