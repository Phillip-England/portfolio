<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bg: '#0a0a0a',
                        panel: '#111111',
                        border: '#222222',
                        primary: '#ff6b6b',
                        secondary: '#ff6b6b',
                        accent: '#2dd4bf',
                        dim: '#555555',
                        text: '#e0e0e0',
                        muted: '#888888',
                    },
                    fontFamily: {
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    boxShadow: {
                        'glow': '0 0 20px rgba(0, 255, 157, 0.15)',
                        'glow-sm': '0 0 10px rgba(0, 255, 157, 0.1)',
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'JetBrains Mono', monospace; }
        #readmeContent {
            color: #d6d6d6;
            font-size: 0.95rem;
            line-height: 1.7;
        }
        #readmeContent h1 {
            color: #f0f0f0;
            font-size: 1.6rem;
            font-weight: 600;
            line-height: 1.2;
            margin: 1.5rem 0 0.75rem;
        }
        #readmeContent h2 {
            color: #e6e6e6;
            font-size: 1.3rem;
            font-weight: 600;
            line-height: 1.25;
            margin: 1.4rem 0 0.6rem;
        }
        #readmeContent h3 {
            color: #dcdcdc;
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.3;
            margin: 1.2rem 0 0.5rem;
        }
        #readmeContent p {
            margin: 0 0 0.9rem;
        }
        #readmeContent strong {
            color: #f0f0f0;
        }
        #readmeContent a {
            color: #9fe3c4;
            text-decoration: underline;
            text-decoration-color: #2a4c3e;
            text-underline-offset: 2px;
        }
        #readmeContent a:hover {
            color: #b8f0d7;
        }
        #readmeContent ul,
        #readmeContent ol {
            padding-left: 1.25rem;
            margin: 0 0 0.9rem;
        }
        #readmeContent li {
            margin: 0.25rem 0;
        }
        #readmeContent pre {
            margin: 0.9rem 0 1.1rem;
        }
        #readmeContent code {
            font-size: 0.9em;
            background: #1f2230;
            border: 1px solid #3b3f50;
            border-radius: 4px;
            padding: 0.05rem 0.25rem;
        }
        #readmeContent hr {
            border-color: #222222;
            margin: 1.2rem 0;
        }
        #readmeContent blockquote {
            border-left: 2px solid #2a2a2a;
            color: #bdbdbd;
            margin: 1rem 0;
            padding-left: 0.9rem;
        }
        #readmeContent img {
            max-width: 100%;
            border-radius: 8px;
            border: 1px solid #222222;
            margin: 0.8rem 0 1rem;
        }
        #readmeContent table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
        }
        #readmeContent th,
        #readmeContent td {
            border: 1px solid #222222;
            padding: 0.5rem 0.6rem;
            text-align: left;
        }
        #readmeContent th {
            background: #121212;
            color: #e6e6e6;
        }
        #readmeContent pre,
        #readmeContent pre.chroma {
            background: #282a36;
            border: 1px solid #3b3f50;
            border-radius: 6px;
            padding: 0.75rem;
            width: 100%;
            box-sizing: border-box;
            overflow-x: auto;
            color: #f8f8f2;
        }
        #readmeContent pre code {
            background: transparent;
            border: 0;
            padding: 0;
        }
        .chroma {
            color: #f8f8f2;
            background-color: #282a36;
        }
        .chroma .err { color: #f8f8f2; background-color: #ff5555; }
        .chroma .hl { background-color: #ffffcc; }
        .chroma .lnlinks { outline: none; text-decoration: none; color: inherit; }
        .chroma .lntd { vertical-align: top; padding: 0; margin: 0; border: 0; }
        .chroma .lntable { border-spacing: 0; padding: 0; margin: 0; border: 0; }
        .chroma .ln { vertical-align: top; padding-right: 0.4em; padding-left: 0.4em; color: #7f7f7f; }
        .chroma .line { display: flex; }
        .chroma .k { color: #ff79c6; }
        .chroma .kc { color: #ff79c6; }
        .chroma .kd { color: #ff79c6; }
        .chroma .kn { color: #ff79c6; }
        .chroma .kp { color: #ff79c6; }
        .chroma .kr { color: #ff79c6; }
        .chroma .kt { color: #8be9fd; }
        .chroma .na { color: #50fa7b; }
        .chroma .nb { color: #8be9fd; }
        .chroma .nc { color: #50fa7b; }
        .chroma .no { color: #bd93f9; }
        .chroma .nd { color: #ff79c6; }
        .chroma .ni { color: #f8f8f2; }
        .chroma .ne { color: #50fa7b; }
        .chroma .nf { color: #50fa7b; }
        .chroma .nt { color: #ff79c6; }
        .chroma .nv { color: #8be9fd; }
        .chroma .s { color: #f1fa8c; }
        .chroma .sa { color: #f1fa8c; }
        .chroma .sb { color: #f1fa8c; }
        .chroma .sc { color: #f1fa8c; }
        .chroma .dl { color: #f1fa8c; }
        .chroma .sd { color: #f1fa8c; }
        .chroma .s2 { color: #f1fa8c; }
        .chroma .se { color: #f1fa8c; }
        .chroma .sh { color: #f1fa8c; }
        .chroma .si { color: #f1fa8c; }
        .chroma .sx { color: #f1fa8c; }
        .chroma .sr { color: #f1fa8c; }
        .chroma .s1 { color: #f1fa8c; }
        .chroma .ss { color: #f1fa8c; }
        .chroma .m { color: #bd93f9; }
        .chroma .mb { color: #bd93f9; }
        .chroma .mf { color: #bd93f9; }
        .chroma .mh { color: #bd93f9; }
        .chroma .mi { color: #bd93f9; }
        .chroma .il { color: #bd93f9; }
        .chroma .mo { color: #bd93f9; }
        .chroma .o { color: #ff79c6; }
        .chroma .ow { color: #ff79c6; }
        .chroma .c { color: #6272a4; }
        .chroma .ch { color: #6272a4; }
        .chroma .cm { color: #6272a4; }
        .chroma .c1 { color: #6272a4; }
        .chroma .cs { color: #6272a4; }
        .chroma .cp { color: #ff79c6; }
        .chroma .cpf { color: #ff79c6; }
        .chroma .gd { color: #8b080b; }
        .chroma .ge { font-style: italic; }
        .chroma .gi { color: #50fa7b; }
        .chroma .go { color: #44475a; }
        .chroma .gp { color: #ff79c6; }
        .chroma .gs { font-weight: bold; }
        .chroma .gu { color: #8be9fd; }
        .chroma .gt { color: #ff5555; }
        .chroma .gl { text-decoration: underline; }
        .cursor-blink { animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        .scan-line {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: rgba(0, 255, 157, 0.1);
            animation: scan 4s linear infinite;
            pointer-events: none;
        }
        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        .matrix-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.03;
            z-index: 0;
        }
        .grid-bg {
            background-image: 
                linear-gradient(rgba(0, 255, 157, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 157, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        .panel-hover:hover {
            box-shadow: 0 0 15px rgba(0, 255, 157, 0.1);
            border-color: #ff6b6b;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #ff6b6b; }
    </style>
</head>
<body class="bg-[#0a0a0a] text-[#e0e0e0] min-h-screen antialiased selection:bg-[#ff6b6b] selection:text-[#0a0a0a]">
    <canvas id="matrix" class="matrix-rain"></canvas>
    <div class="scan-line"></div>

    {{template "navbar" .}}

    <main class="pt-20 pb-16 px-4 relative z-10 grid-bg min-h-screen">
        <div class="max-w-4xl mx-auto">
            <a href="/" class="inline-flex items-center gap-2 text-xs text-[#555] hover:text-[#ff6b6b] transition-colors mb-6">
                <span>←</span> cd ..
            </a>

            <div class="space-y-6">
                <div class="bg-[#111] border border-[#222] rounded-lg p-5">
                    <div class="flex items-center justify-between text-xs text-[#555] mb-4">
                        <a href="https://github.com/{{.GitHubUser}}/{{.CurrentProject.Slug}}" target="_blank" class="inline-flex items-center gap-2 text-[#2dd4bf] hover:underline">
                            <span>↗</span> View on GitHub
                        </a>
                    </div>
                    <div id="readmeContent" class="max-w-none">
                        {{.ReadmeHTML}}
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="border-t border-[#222] py-6 mt-12 bg-[#0a0a0a]">
        <div class="max-w-6xl mx-auto px-4 text-center">
            <p class="text-xs text-[#555]">
                <span class="text-[#ff6b6b]">© 2026</span> Phillip England 
                <span class="text-[#333] mx-2">|</span> 
                <span class="text-[#555]">Built with</span> 
                <span class="text-[#2dd4bf]">Go</span> 
                <span class="text-[#555]">+</span> 
                <span class="text-[#ff6b6b]">Tailwind</span>
            </p>
        </div>
    </footer>

    <script src="/static/site.js" defer></script>
    <script>
        (function(){
            const canvas = document.getElementById('matrix');
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
            const fontSize = 14;
            const columns = canvas.width / fontSize;
            const drops = Array(Math.floor(columns)).fill(1);
            function draw() {
                ctx.fillStyle = 'rgba(10, 10, 10, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff6b6b';
                ctx.font = fontSize + 'px monospace';
                for(let i = 0; i < drops.length; i++) {
                    const char = chars[Math.floor(Math.random() * chars.length)];
                    ctx.fillText(char, i * fontSize, drops[i] * fontSize);
                    if(drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                }
            }
            setInterval(draw, 50);
            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });
        })();
    </script>
</body>
</html>
