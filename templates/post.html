<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bg: '#0a0a0a',
                        panel: '#111111',
                        border: '#222222',
                        primary: '#ff6b6b',
                        secondary: '#ff6b6b',
                        accent: '#2dd4bf',
                        dim: '#555555',
                        text: '#e0e0e0',
                        muted: '#888888',
                    },
                    fontFamily: {
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    boxShadow: {
                        'glow': '0 0 20px rgba(0, 255, 157, 0.15)',
                        'glow-sm': '0 0 10px rgba(0, 255, 157, 0.1)',
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'JetBrains Mono', monospace; }
        .cursor-blink { animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        .scan-line {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: rgba(0, 255, 157, 0.1);
            animation: scan 4s linear infinite;
            pointer-events: none;
        }
        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        .matrix-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.03;
            z-index: 0;
        }
        .grid-bg {
            background-image: 
                linear-gradient(rgba(0, 255, 157, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 157, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        .panel-hover:hover {
            box-shadow: 0 0 15px rgba(0, 255, 157, 0.1);
            border-color: #ff6b6b;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #ff6b6b; }
        .prose {
            color: #d6d6d6;
            font-size: 0.95rem;
            line-height: 1.75;
            word-break: break-word;
        }
        .prose h1, .prose h2, .prose h3, .prose h4 {
            color: #e0e0e0;
            font-weight: 600;
            line-height: 1.2;
            margin: 1.6rem 0 0.7rem;
        }
        .prose h1 { font-size: 1.75rem; }
        .prose h2 { font-size: 1.4rem; }
        .prose h3 { font-size: 1.2rem; }
        .prose h4 { font-size: 1.05rem; }
        .prose p { margin: 0 0 0.95rem; color: #bdbdbd; }
        .prose strong { color: #f0f0f0; }
        .prose a {
            color: #2dd4bf;
            text-decoration: underline;
            text-decoration-color: #5d4b16;
            text-underline-offset: 2px;
        }
        .prose a:hover { color: #ffe38a; }
        .prose ul, .prose ol { padding-left: 1.25rem; margin: 0 0 0.95rem; }
        .prose li { margin: 0.3rem 0; }
        .prose pre {
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 0.85rem;
            overflow-x: auto;
            margin: 0.95rem 0 1.15rem;
        }
        .prose code {
            color: #ff6b6b;
            background: #1a1f1c;
            border: 1px solid #1d2a24;
            border-radius: 4px;
            padding: 0.05rem 0.25rem;
            font-size: 0.9em;
        }
        .prose pre code {
            color: inherit;
            background: transparent;
            border: 0;
            padding: 0;
        }
        .prose blockquote {
            border-left: 3px solid #ff6b6b;
            color: #8a8a8a;
            padding-left: 1rem;
            margin: 1rem 0;
        }
        .prose hr { border-color: #222; margin: 1.2rem 0; }
        .prose img { max-width: 100%; border-radius: 8px; border: 1px solid #222; }
        .prose table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
        .prose th, .prose td { border: 1px solid #222; padding: 0.5rem 0.6rem; text-align: left; }
        .prose th { color: #e0e0e0; background: #111; }
        .chroma {
            color: #f8f8f2;
            background-color: #282a36;
        }
        .chroma .err { color: #f8f8f2; background-color: #ff5555; }
        .chroma .hl { background-color: #ffffcc; }
        .chroma .lnlinks { outline: none; text-decoration: none; color: inherit; }
        .chroma .lntd { vertical-align: top; padding: 0; margin: 0; border: 0; }
        .chroma .lntable { border-spacing: 0; padding: 0; margin: 0; border: 0; }
        .chroma .ln { vertical-align: top; padding-right: 0.4em; padding-left: 0.4em; color: #7f7f7f; }
        .chroma .line { display: flex; }
        .chroma .k { color: #ff79c6; }
        .chroma .kc { color: #ff79c6; }
        .chroma .kd { color: #ff79c6; }
        .chroma .kn { color: #ff79c6; }
        .chroma .kp { color: #ff79c6; }
        .chroma .kr { color: #ff79c6; }
        .chroma .kt { color: #8be9fd; }
        .chroma .na { color: #50fa7b; }
        .chroma .nb { color: #8be9fd; }
        .chroma .nc { color: #50fa7b; }
        .chroma .no { color: #bd93f9; }
        .chroma .nd { color: #ff79c6; }
        .chroma .ni { color: #f8f8f2; }
        .chroma .ne { color: #50fa7b; }
        .chroma .nf { color: #50fa7b; }
        .chroma .nt { color: #ff79c6; }
        .chroma .nv { color: #8be9fd; }
        .chroma .s { color: #f1fa8c; }
        .chroma .sa { color: #f1fa8c; }
        .chroma .sb { color: #f1fa8c; }
        .chroma .sc { color: #f1fa8c; }
        .chroma .dl { color: #f1fa8c; }
        .chroma .sd { color: #f1fa8c; }
        .chroma .s2 { color: #f1fa8c; }
        .chroma .se { color: #f1fa8c; }
        .chroma .sh { color: #f1fa8c; }
        .chroma .si { color: #f1fa8c; }
        .chroma .sx { color: #f1fa8c; }
        .chroma .sr { color: #f1fa8c; }
        .chroma .s1 { color: #f1fa8c; }
        .chroma .ss { color: #f1fa8c; }
        .chroma .m { color: #bd93f9; }
        .chroma .mb { color: #bd93f9; }
        .chroma .mf { color: #bd93f9; }
    </style>
</head>
<body class="bg-[#0a0a0a] text-[#e0e0e0] min-h-screen antialiased selection:bg-[#ff6b6b] selection:text-[#0a0a0a]">
    <canvas id="matrix" class="matrix-rain"></canvas>
    <div class="scan-line"></div>

    {{template "navbar" .}}

    <main class="pt-28 sm:pt-20 pb-16 px-4 relative z-10 grid-bg min-h-screen">
        <div class="max-w-3xl mx-auto">
            <a href="/blog" class="inline-flex items-center gap-2 text-xs text-[#555] hover:text-[#2dd4bf] transition-colors mb-6">
                <span>←</span> cd ..
            </a>

            <article class="space-y-6">
                <div class="bg-[#111] border border-[#222] rounded-lg p-6">
                    <header class="mb-6 pb-4 border-b border-[#222]">
                        <h1 class="text-2xl font-semibold text-[#e0e0e0] mb-2">{{.CurrentPost.Title}}</h1>
                        <time class="text-xs text-[#555]">{{.CurrentPost.Date}}</time>
                    </header>
                    <div class="prose max-w-none text-sm">
                        {{.CurrentPost.Content}}
                    </div>
                </div>
            </article>
        </div>
    </main>

    <footer class="border-t border-[#222] py-6 mt-12 bg-[#0a0a0a]">
        <div class="max-w-6xl mx-auto px-4 text-center">
            <p class="text-xs text-[#555]">
                <span class="text-[#ff6b6b]">© 2026</span> Phillip England 
                <span class="text-[#333] mx-2">|</span> 
                <span class="text-[#555]">Built with</span> 
                <span class="text-[#2dd4bf]">Go</span> 
                <span class="text-[#555]">+</span> 
                <span class="text-[#ff6b6b]">Tailwind</span>
            </p>
        </div>
    </footer>

    <script src="/static/site.js" defer></script>
    <script>
        (function(){
            const canvas = document.getElementById('matrix');
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
            const fontSize = 14;
            const columns = canvas.width / fontSize;
            const drops = Array(Math.floor(columns)).fill(1);
            function draw() {
                ctx.fillStyle = 'rgba(10, 10, 10, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff6b6b';
                ctx.font = fontSize + 'px monospace';
                for(let i = 0; i < drops.length; i++) {
                    const char = chars[Math.floor(Math.random() * chars.length)];
                    ctx.fillText(char, i * fontSize, drops[i] * fontSize);
                    if(drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                }
            }
            setInterval(draw, 50);
            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });
        })();
    </script>
</body>
</html>
