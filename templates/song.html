<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.}} | Phillip England</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png">
    <style>
        :root, [data-theme="blue"] {
            --accent: #4a9eff;
            --accent-rgb: 74, 158, 255;
        }
        [data-theme="white"] {
            --accent: #ffffff;
            --accent-rgb: 255, 255, 255;
        }
        [data-theme="green"] {
            --accent: #4ae0a0;
            --accent-rgb: 74, 224, 160;
        }
        [data-theme="purple"] {
            --accent: #a78bfa;
            --accent-rgb: 167, 139, 250;
        }
        [data-theme="red"] {
            --accent: #ff6b6b;
            --accent-rgb: 255, 107, 107;
        }
        [data-theme="gold"] {
            --accent: #f0c040;
            --accent-rgb: 240, 192, 64;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        #visualizer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .overlay {
            position: relative;
            z-index: 2;
        }

        /* Nav */
        nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 20;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 3rem;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nav-profile {
            width: 36px; height: 36px;
            border-radius: 50%;
            object-fit: cover;
            filter: grayscale(100%);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .logo-group { display: flex; align-items: center; gap: 0.75rem; }
        .logo { font-size: 1.4rem; font-weight: 700; letter-spacing: 0.05em; color: var(--accent); text-decoration: none; }
        .logo span { color: #888; font-weight: 300; }

        .nav-right { display: flex; align-items: center; gap: 1.5rem; }
        nav ul { list-style: none; display: flex; gap: 2rem; }

        .theme-dots { display: flex; gap: 0.4rem; align-items: center; }
        .theme-dot {
            width: 18px; height: 18px; border-radius: 50%;
            border: 2px solid transparent; cursor: pointer;
            transition: border-color 0.2s, transform 0.2s;
        }
        .theme-dot:hover { transform: scale(1.2); }
        .theme-dot.active { border-color: rgba(255, 255, 255, 0.7); }

        nav a {
            color: #aaa; text-decoration: none; font-size: 0.9rem;
            letter-spacing: 0.03em; transition: color 0.2s; cursor: pointer;
        }
        nav a:hover { color: var(--accent); }

        /* Hamburger */
        .hamburger {
            display: none; background: none; border: none;
            cursor: pointer; padding: 0.5rem; z-index: 25;
        }
        .hamburger-line {
            display: block; width: 22px; height: 2px;
            background: #ccc; margin: 4px 0; border-radius: 2px;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .hamburger.active .hamburger-line:nth-child(1) { transform: translateY(6px) rotate(45deg); }
        .hamburger.active .hamburger-line:nth-child(2) { opacity: 0; }
        .hamburger.active .hamburger-line:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

        .mobile-menu { display: none; }

        /* Minimal player bar */
        .player-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 15;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(var(--accent-rgb), 0.15);
            padding: 0.6rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .play-btn {
            width: 36px; height: 36px;
            border-radius: 50%;
            border: 2px solid rgba(var(--accent-rgb), 0.4);
            background: rgba(var(--accent-rgb), 0.1);
            color: var(--accent);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .play-btn:hover {
            background: rgba(var(--accent-rgb), 0.2);
            border-color: var(--accent);
            transform: scale(1.05);
        }
        .play-btn svg { width: 16px; height: 16px; fill: currentColor; }

        .player-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex: 1;
            min-width: 0;
        }

        .player-song-name {
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: 600;
            letter-spacing: 0.03em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-status {
            font-size: 0.75rem;
            color: #666;
            letter-spacing: 0.03em;
            white-space: nowrap;
        }

        .player-copyright {
            font-size: 0.6rem;
            color: #444;
            letter-spacing: 0.03em;
            white-space: nowrap;
            flex-shrink: 0;
        }

        @media (max-width: 768px) {
            nav { padding: 0.75rem 1.5rem; }
            .nav-right { display: none; }
            .hamburger { display: block; }
            .mobile-menu {
                display: flex;
                flex-direction: column;
                position: fixed;
                top: 0; right: 0;
                width: 260px; height: 100vh;
                z-index: 19;
                background: rgba(10, 10, 10, 0.95);
                backdrop-filter: blur(16px);
                border-left: 1px solid rgba(255, 255, 255, 0.06);
                padding: 5rem 2rem 2rem;
                transform: translateX(100%);
                transition: transform 0.3s ease;
            }
            .mobile-menu.open { transform: translateX(0); }
            .mobile-menu ul {
                list-style: none; display: flex;
                flex-direction: column; gap: 0.25rem;
            }
            .mobile-menu ul li a {
                display: block; padding: 0.75rem 0;
                color: #aaa; text-decoration: none;
                font-size: 1rem; letter-spacing: 0.03em;
                transition: color 0.2s;
            }
            .mobile-menu ul li a:hover { color: var(--accent); }
            .mobile-theme-dots {
                display: flex; gap: 0.5rem;
                margin-top: 1.5rem; padding-top: 1.5rem;
                border-top: 1px solid rgba(255, 255, 255, 0.06);
            }
            .player-bar { padding: 0.5rem 1rem; }
            .player-copyright { display: none; }
        }
    </style>
</head>
<body>
    <canvas id="visualizer"></canvas>

    <div class="overlay">
        <nav aria-label="Main navigation">
            <div class="logo-group">
                <img src="/static/profile.jpeg" alt="Phillip England" class="nav-profile">
                <a href="/" class="logo">PHILLIP <span>ENGLAND</span></a>
            </div>
            <button class="hamburger" id="hamburger" aria-label="Toggle menu" aria-expanded="false">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>
            <div class="nav-right">
                <div class="theme-dots" id="theme-dots">
                    <span class="theme-dot" data-theme="white" style="background:#ffffff"></span>
                    <span class="theme-dot active" data-theme="blue" style="background:#4a9eff"></span>
                    <span class="theme-dot" data-theme="green" style="background:#4ae0a0"></span>
                    <span class="theme-dot" data-theme="purple" style="background:#a78bfa"></span>
                    <span class="theme-dot" data-theme="red" style="background:#ff6b6b"></span>
                    <span class="theme-dot" data-theme="gold" style="background:#f0c040"></span>
                </div>
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="/music">Music</a></li>
                </ul>
            </div>
        </nav>

        <div class="mobile-menu" id="mobile-menu">
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/music">Music</a></li>
            </ul>
            <div class="mobile-theme-dots">
                <span class="theme-dot" data-theme="white" style="background:#ffffff"></span>
                <span class="theme-dot" data-theme="blue" style="background:#4a9eff"></span>
                <span class="theme-dot" data-theme="green" style="background:#4ae0a0"></span>
                <span class="theme-dot" data-theme="purple" style="background:#a78bfa"></span>
                <span class="theme-dot" data-theme="red" style="background:#ff6b6b"></span>
                <span class="theme-dot" data-theme="gold" style="background:#f0c040"></span>
            </div>
        </div>

        <div class="player-bar">
            <button class="play-btn" id="play-btn" title="Play/Pause">
                <svg id="play-icon" viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg>
                <svg id="pause-icon" viewBox="0 0 24 24" style="display:none"><rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/></svg>
            </button>
            <div class="player-info">
                <span class="player-song-name">{{.}}</span>
                <span class="player-status" id="player-status">Loading...</span>
            </div>
            <span class="player-copyright">&copy; 2025 Phillip England</span>
        </div>
    </div>

    <script>
    (function() {
        const SONG_NAME = "{{.}}";
        const SONG_FILE = SONG_NAME + ".wav";

        // ─── Theme ───
        const themeRgbMap = {
            white:  [255, 255, 255],
            blue:   [74, 158, 255],
            green:  [74, 224, 160],
            purple: [167, 139, 250],
            red:    [255, 107, 107],
            gold:   [240, 192, 64],
        };
        let accentRgb = [74, 158, 255];

        const dots = document.querySelectorAll('.theme-dot');
        const saved = localStorage.getItem('theme');

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            accentRgb = themeRgbMap[theme] || themeRgbMap.blue;
            dots.forEach(d => d.classList.toggle('active', d.dataset.theme === theme));
        }
        setTheme((saved && themeRgbMap[saved]) ? saved : 'blue');
        dots.forEach(dot => dot.addEventListener('click', () => setTheme(dot.dataset.theme)));

        // ─── Mobile menu ───
        const hamburger = document.getElementById('hamburger');
        const mobileMenu = document.getElementById('mobile-menu');
        hamburger.addEventListener('click', function() {
            hamburger.classList.toggle('active');
            mobileMenu.classList.toggle('open');
            hamburger.setAttribute('aria-expanded', mobileMenu.classList.contains('open'));
        });

        // ─── Canvas setup ───
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // ─── Audio engine ───
        let audioCtx = null;
        let analyser = null;
        let sourceNode = null;
        let audioBuffer = null;
        let isPlaying = false;
        let startTime = 0;
        let pauseOffset = 0;

        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const playerStatus = document.getElementById('player-status');

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 2048;
            analyser.smoothingTimeConstant = 0.8;
            analyser.connect(audioCtx.destination);
        }

        function updatePlayIcon() {
            playIcon.style.display = isPlaying ? 'none' : '';
            pauseIcon.style.display = isPlaying ? '' : 'none';
        }

        function playSong() {
            if (!audioBuffer || !audioCtx) return;
            if (sourceNode) {
                sourceNode.onended = null;
                sourceNode.stop();
                sourceNode.disconnect();
            }
            sourceNode = audioCtx.createBufferSource();
            sourceNode.buffer = audioBuffer;
            sourceNode.connect(analyser);
            sourceNode.onended = function() {
                if (isPlaying) {
                    isPlaying = false;
                    pauseOffset = 0;
                    updatePlayIcon();
                    playerStatus.textContent = 'Ended';
                }
            };
            sourceNode.start(0, pauseOffset);
            startTime = audioCtx.currentTime - pauseOffset;
            isPlaying = true;
            updatePlayIcon();
            playerStatus.textContent = 'Playing';
        }

        function pauseSong() {
            if (!sourceNode || !isPlaying) return;
            pauseOffset = audioCtx.currentTime - startTime;
            sourceNode.onended = null;
            sourceNode.stop();
            sourceNode.disconnect();
            sourceNode = null;
            isPlaying = false;
            updatePlayIcon();
            playerStatus.textContent = 'Paused';
        }

        playBtn.addEventListener('click', function() {
            if (!audioBuffer) return;
            if (isPlaying) {
                pauseSong();
            } else {
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                playSong();
            }
        });

        // ─── Auto-load song ───
        async function autoLoad() {
            initAudio();
            try {
                const resp = await fetch('/music/' + encodeURIComponent(SONG_FILE));
                const arrayBuf = await resp.arrayBuffer();
                audioBuffer = await audioCtx.decodeAudioData(arrayBuf);
                playerStatus.textContent = 'Ready — tap play';
            } catch (e) {
                playerStatus.textContent = 'Failed to load';
            }
        }
        autoLoad();

        // ─── Audio data extraction ───
        const freqData = new Uint8Array(1024);
        const timeData = new Uint8Array(2048);

        function getAudioEnergy() {
            if (!analyser || !isPlaying) return { bass: 0, mid: 0, treble: 0, raw: freqData, time: timeData };
            analyser.getByteFrequencyData(freqData);
            analyser.getByteTimeDomainData(timeData);

            const sampleRate = audioCtx.sampleRate;
            const binSize = sampleRate / analyser.fftSize;

            let bass = 0, bassCount = 0;
            let mid = 0, midCount = 0;
            let treble = 0, trebleCount = 0;

            for (let i = 0; i < freqData.length; i++) {
                const freq = i * binSize;
                const val = freqData[i] / 255;
                if (freq < 250) { bass += val; bassCount++; }
                else if (freq < 2000) { mid += val; midCount++; }
                else { treble += val; trebleCount++; }
            }

            return {
                bass: bassCount > 0 ? bass / bassCount : 0,
                mid: midCount > 0 ? mid / midCount : 0,
                treble: trebleCount > 0 ? treble / trebleCount : 0,
                raw: freqData,
                time: timeData,
            };
        }

        // ─── Visualizer state ───
        let time = 0;

        const attractorPoints = [];
        const NUM_ATTRACTOR = 8000;
        for (let i = 0; i < NUM_ATTRACTOR; i++) {
            attractorPoints.push({ x: Math.random() * 4 - 2, y: Math.random() * 4 - 2 });
        }

        const particles = [];
        const MAX_PARTICLES = 300;

        function spawnParticles(cx, cy, energy, r, g, b) {
            const count = Math.floor(energy * 12);
            for (let i = 0; i < count && particles.length < MAX_PARTICLES; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = (0.5 + Math.random() * 3) * energy;
                particles.push({
                    x: cx, y: cy,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1,
                    decay: 0.008 + Math.random() * 0.015,
                    r: r, g: g, b: b,
                    size: 1.5 + Math.random() * 2.5,
                });
            }
        }

        // ─── Drawing functions ───

        function drawAttractor(w, h, energy) {
            const bass = energy.bass;
            const mid = energy.mid;

            const a = -1.4 + Math.sin(time * 0.3) * 0.5 + bass * 0.8;
            const b = 1.6 + Math.cos(time * 0.2) * 0.3 + mid * 0.5;
            const c = 1.0 + Math.sin(time * 0.4) * 0.4 - bass * 0.3;
            const d = 0.7 + Math.cos(time * 0.35) * 0.3 + mid * 0.4;

            const scale = Math.min(w, h) * 0.18;
            const cx = w / 2;
            const cy = h / 2;
            const alpha = 0.15 + bass * 0.25;

            for (let i = 0; i < attractorPoints.length; i++) {
                const p = attractorPoints[i];
                const nx = Math.sin(a * p.y) + c * Math.cos(a * p.x);
                const ny = Math.sin(b * p.x) + d * Math.cos(b * p.y);
                p.x = nx;
                p.y = ny;

                const sx = cx + nx * scale;
                const sy = cy + ny * scale;

                if (sx >= 0 && sx < w && sy >= 0 && sy < h) {
                    const bright = 0.6 + 0.4 * (i / attractorPoints.length);
                    ctx.fillStyle = 'rgba(' +
                        Math.floor(accentRgb[0] * bright) + ',' +
                        Math.floor(accentRgb[1] * bright) + ',' +
                        Math.floor(accentRgb[2] * bright) + ',' + alpha + ')';
                    ctx.fillRect(sx, sy, 1.5, 1.5);
                }
            }
        }

        const juliaScale = 4;
        let juliaImageData = null;

        function drawJulia(w, h, energy) {
            const jw = Math.floor(w / juliaScale);
            const jh = Math.floor(h / juliaScale);

            if (!juliaImageData || juliaImageData.width !== jw || juliaImageData.height !== jh) {
                juliaImageData = ctx.createImageData(jw, jh);
            }

            const cr = -0.7 + Math.sin(time * 0.15) * 0.15 + energy.treble * 0.2;
            const ci = 0.27015 + Math.cos(time * 0.12) * 0.1 + energy.mid * 0.15;
            const maxIter = 30;
            const data = juliaImageData.data;

            for (let py = 0; py < jh; py++) {
                for (let px = 0; px < jw; px++) {
                    let zr = (px / jw - 0.5) * 3.5;
                    let zi = (py / jh - 0.5) * 3.5 * (jh / jw);
                    let iter = 0;

                    while (zr * zr + zi * zi < 4 && iter < maxIter) {
                        const tmp = zr * zr - zi * zi + cr;
                        zi = 2 * zr * zi + ci;
                        zr = tmp;
                        iter++;
                    }

                    const idx = (py * jw + px) * 4;
                    if (iter < maxIter) {
                        const t = iter / maxIter;
                        data[idx]     = Math.floor(accentRgb[0] * t * 0.3);
                        data[idx + 1] = Math.floor(accentRgb[1] * t * 0.3);
                        data[idx + 2] = Math.floor(accentRgb[2] * t * 0.3);
                        data[idx + 3] = Math.floor(t * 120);
                    } else {
                        data[idx] = data[idx+1] = data[idx+2] = 0;
                        data[idx + 3] = 0;
                    }
                }
            }

            const tmpCanvas = document.createElement('canvas');
            tmpCanvas.width = jw;
            tmpCanvas.height = jh;
            tmpCanvas.getContext('2d').putImageData(juliaImageData, 0, 0);
            ctx.drawImage(tmpCanvas, 0, 0, w, h);
        }

        function drawFractalSpirals(w, h, energy) {
            const cx = w / 2;
            const cy = h / 2;
            const numArms = 5;
            const maxDepth = 7 + Math.floor(energy.mid * 4);
            const baseLen = Math.min(w, h) * 0.12 * (0.7 + energy.bass * 0.6);

            ctx.lineWidth = 1;

            for (let arm = 0; arm < numArms; arm++) {
                const baseAngle = (arm / numArms) * Math.PI * 2 + time * 0.3;
                drawBranch(cx, cy, baseAngle, baseLen, maxDepth, 0, energy);
            }
        }

        function drawBranch(x, y, angle, len, depth, level, energy) {
            if (depth <= 0 || len < 2) return;

            const ex = x + Math.cos(angle) * len;
            const ey = y + Math.sin(angle) * len;
            const alpha = 0.15 + (1 - level / 10) * 0.35 * (0.5 + energy.bass * 0.5);

            ctx.strokeStyle = 'rgba(' + accentRgb[0] + ',' + accentRgb[1] + ',' + accentRgb[2] + ',' + alpha + ')';
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(ex, ey);
            ctx.stroke();

            const branchAngle = 0.35 + energy.treble * 0.5 + Math.sin(time * 0.5 + level) * 0.15;
            const shrink = 0.68 + energy.mid * 0.1;

            drawBranch(ex, ey, angle + branchAngle, len * shrink, depth - 1, level + 1, energy);
            drawBranch(ex, ey, angle - branchAngle, len * shrink, depth - 1, level + 1, energy);
        }

        function updateAndDrawParticles(dt) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vx *= 0.98;
                p.vy *= 0.98;
                p.life -= p.decay;

                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.fillStyle = 'rgba(' + p.r + ',' + p.g + ',' + p.b + ',' + (p.life * 0.7) + ')';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // ─── Main render loop ───
        let lastTime = 0;
        let lastBass = 0;

        function render(ts) {
            requestAnimationFrame(render);

            const dt = lastTime ? (ts - lastTime) / 1000 : 0.016;
            lastTime = ts;
            time += dt;

            const w = canvas.width;
            const h = canvas.height;
            const energy = getAudioEnergy();

            ctx.fillStyle = 'rgba(10, 10, 10, 0.15)';
            ctx.fillRect(0, 0, w, h);

            drawJulia(w, h, energy);
            drawAttractor(w, h, energy);
            drawFractalSpirals(w, h, energy);

            if (energy.bass > 0.4 && energy.bass - lastBass > 0.1) {
                spawnParticles(w / 2, h / 2, energy.bass,
                    accentRgb[0], accentRgb[1], accentRgb[2]);
            }
            lastBass = energy.bass;

            updateAndDrawParticles(dt);
        }

        requestAnimationFrame(render);
    })();
    </script>
</body>
</html>
