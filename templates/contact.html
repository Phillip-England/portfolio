<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bg: '#0a0a0a',
                        panel: '#111111',
                        border: '#222222',
                        primary: '#ff6b6b',
                        secondary: '#ff6b6b',
                        accent: '#2dd4bf',
                        dim: '#555555',
                        text: '#e0e0e0',
                        muted: '#888888',
                    },
                    fontFamily: {
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    boxShadow: {
                        'glow': '0 0 20px rgba(0, 255, 157, 0.15)',
                        'glow-sm': '0 0 10px rgba(0, 255, 157, 0.1)',
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'JetBrains Mono', monospace; }
        .cursor-blink { animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        .scan-line {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: rgba(0, 255, 157, 0.1);
            animation: scan 4s linear infinite;
            pointer-events: none;
        }
        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        .matrix-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.03;
            z-index: 0;
        }
        .grid-bg {
            background-image: 
                linear-gradient(rgba(0, 255, 157, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 157, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        .panel-hover:hover {
            box-shadow: 0 0 15px rgba(0, 255, 157, 0.1);
            border-color: #ff6b6b;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #ff6b6b; }
    </style>
</head>
<body class="bg-[#0a0a0a] text-[#e0e0e0] min-h-screen antialiased selection:bg-[#ff6b6b] selection:text-[#0a0a0a]">
    <canvas id="matrix" class="matrix-rain"></canvas>
    <div class="scan-line"></div>

    {{template "navbar" .}}

    <main class="pt-28 sm:pt-20 pb-16 px-4 relative z-10 grid-bg min-h-screen">
        <div class="max-w-3xl mx-auto">
            <div class="flex items-center gap-2 text-xs text-[#555] mb-8">
                <span>~/</span>
                <span class="text-[#ff6b6b]">contact</span>
                <span class="cursor-blink">_</span>
            </div>

            <div class="space-y-6">
                <div class="bg-[#111] border border-[#222] rounded-lg p-6 shadow-glow">
                    <div class="flex items-center gap-2 mb-4 border-b border-[#222] pb-3">
                        <div class="flex gap-1.5">
                            <div class="w-3 h-3 rounded-full bg-[#ff6b6b]"></div>
                            <div class="w-3 h-3 rounded-full bg-[#2dd4bf]"></div>
                            <div class="w-3 h-3 rounded-full bg-[#ff6b6b]"></div>
                        </div>
                        <span class="text-xs text-[#555] ml-2">bash — 80x24</span>
                    </div>
                    <div class="space-y-3 font-mono text-sm mb-6">
                        <div>
                            <span class="text-[#ff6b6b]">➜</span> <span class="text-[#2dd4bf]">~</span> <span class="text-[#555]">mail -s "hello"</span>
                        </div>
                        <p class="text-[#e0e0e0]">Drop a short message. I typically respond within 24-48 hours.</p>
                    </div>

                    <form id="contactForm" class="space-y-4">
                        <div>
                            <label for="email" class="block text-xs text-[#555] mb-2">EMAIL_ADDRESS</label>
                            <input type="email" id="email" name="email" required
                                class="w-full px-4 py-3 bg-[#0a0a0a] border border-[#333] rounded-lg focus:ring-1 focus:ring-[#ff6b6b] focus:border-[#ff6b6b] outline-none transition-colors text-sm"
                                placeholder="you@example.com">
                        </div>
                        <div>
                            <label for="message" class="block text-xs text-[#555] mb-2">MESSAGE_CONTENT (max 255)</label>
                            <textarea id="message" name="message" required maxlength="255" rows="4"
                                class="w-full px-4 py-3 bg-[#0a0a0a] border border-[#333] rounded-lg focus:ring-1 focus:ring-[#ff6b6b] focus:border-[#ff6b6b] outline-none transition-colors text-sm resize-none"
                                placeholder="Your message here..."></textarea>
                            <p class="text-xs text-[#555] mt-2"><span id="count">0</span>/255</p>
                        </div>
                        <button type="submit"
                            class="w-full py-3 px-6 bg-[#ff6b6b] text-[#0a0a0a] font-semibold rounded-lg hover:bg-[#ff6b6b]/90 transition-colors">
                            ./send_message.sh
                        </button>
                        <p id="status" class="text-xs text-[#ff6b6b]" aria-live="polite"></p>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="border-t border-[#222] py-6 mt-12 bg-[#0a0a0a]">
        <div class="max-w-6xl mx-auto px-4 text-center">
            <p class="text-xs text-[#555]">
                <span class="text-[#ff6b6b]">© 2026</span> Phillip England 
                <span class="text-[#333] mx-2">|</span> 
                <span class="text-[#555]">Built with</span> 
                <span class="text-[#2dd4bf]">Go</span> 
                <span class="text-[#555]">+</span> 
                <span class="text-[#ff6b6b]">Tailwind</span>
            </p>
        </div>
    </footer>

    <script src="/static/contact.js" defer></script>
    <script src="/static/site.js" defer></script>
    <script>
        (function(){
            const canvas = document.getElementById('matrix');
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
            const fontSize = 14;
            const columns = canvas.width / fontSize;
            const drops = Array(Math.floor(columns)).fill(1);
            function draw() {
                ctx.fillStyle = 'rgba(10, 10, 10, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff6b6b';
                ctx.font = fontSize + 'px monospace';
                for(let i = 0; i < drops.length; i++) {
                    const char = chars[Math.floor(Math.random() * chars.length)];
                    ctx.fillText(char, i * fontSize, drops[i] * fontSize);
                    if(drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                }
            }
            setInterval(draw, 50);
            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });
        })();
    </script>
</body>
</html>
