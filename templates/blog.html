<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Phillip England</title>
    <meta name="description" content="Notes from Phillip England on software, websites, and technical services.">
    <link rel="canonical" href="https://phillipengland.com/blog">
    <link rel="icon" type="image/x-icon" href="/static/favicon/favicon.ico">
    <style>
        :root {
            --accent: #f0444f;
            --accent-rgb: 240, 68, 79;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at 20% 0%, rgba(var(--accent-rgb), 0.16), transparent 30rem),
                #08090d;
            color: #e6e6e6;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        }
        nav {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            padding: 1rem clamp(1rem, 4vw, 3rem);
            background: rgba(8, 9, 13, 0.84);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(14px);
        }
        .brand {
            color: var(--accent);
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-decoration: none;
        }
        .nav-actions {
            display: flex;
            align-items: center;
            gap: 1.25rem;
        }
        .home-link {
            color: #b8b8c2;
            font-size: 0.92rem;
            text-decoration: none;
        }
        .home-link:hover {
            color: var(--accent);
        }
        main {
            width: min(900px, calc(100% - 2rem));
            margin: 0 auto;
            padding: clamp(3rem, 8vw, 6rem) 0;
        }
        h1 {
            margin: 0 0 0.75rem;
            color: var(--accent);
            font-size: clamp(2.4rem, 8vw, 5rem);
            line-height: 1;
        }
        .lede {
            max-width: 620px;
            margin: 0 0 3rem;
            color: #aaaab4;
            font-size: 1.08rem;
            line-height: 1.7;
        }
        .post-list {
            display: grid;
            gap: 1rem;
        }
        .post-card {
            display: block;
            padding: 1.35rem;
            background: rgba(255, 255, 255, 0.045);
            border: 1px solid rgba(var(--accent-rgb), 0.22);
            border-radius: 8px;
            color: inherit;
            text-decoration: none;
            transition: border-color 0.2s, transform 0.2s, background 0.2s;
        }
        .post-card:hover {
            background: rgba(var(--accent-rgb), 0.075);
            border-color: rgba(var(--accent-rgb), 0.48);
            transform: translateY(-2px);
        }
        .post-card h2 {
            margin: 0 0 0.5rem;
            color: #f4f4f6;
            font-size: 1.35rem;
            line-height: 1.25;
        }
        .post-meta {
            margin: 0 0 0.65rem;
            color: var(--accent);
            font-size: 0.84rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .post-card p {
            margin: 0;
            color: #a7a7b0;
            line-height: 1.6;
        }
        .empty {
            padding: 1.25rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #aaaab4;
        }
        @media (max-width: 640px) {
            nav {
                align-items: flex-start;
                flex-direction: column;
            }
            .nav-actions {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>
    <nav aria-label="Blog navigation">
        <a class="brand" href="/blog">BLOG</a>
        <div class="nav-actions">
            <a class="home-link" href="/">Main Site</a>
        </div>
    </nav>
    <main>
        <h1>Blog</h1>
        <p class="lede">Notes on software, experiments, developer tools, and the practical side of building for the web.</p>
        <div class="post-list">
            {{if .Posts}}
                {{range .Posts}}
                    <a class="post-card" href="/blog/{{.Slug}}">
                        {{if .Date}}<div class="post-meta">{{.Date}}</div>{{end}}
                        <h2>{{.Title}}</h2>
                        {{if .Description}}<p>{{.Description}}</p>{{end}}
                    </a>
                {{end}}
            {{else}}
                <div class="empty">No posts yet.</div>
            {{end}}
        </div>
    </main>
</body>
</html>
