<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Phillip England</title>
    <meta name="description" content="Notes from Phillip England on software, websites, and technical services.">
    <link rel="canonical" href="https://phillipengland.com/blog">
    <link rel="icon" type="image/x-icon" href="/static/favicon/favicon.ico">
    <style>
        :root, [data-theme="blue"] {
            --accent: #4a9eff;
            --accent-rgb: 74, 158, 255;
        }
        [data-theme="white"] {
            --accent: #ffffff;
            --accent-rgb: 255, 255, 255;
        }
        [data-theme="green"] {
            --accent: #4ae0a0;
            --accent-rgb: 74, 224, 160;
        }
        [data-theme="purple"] {
            --accent: #a78bfa;
            --accent-rgb: 167, 139, 250;
        }
        [data-theme="red"] {
            --accent: #ff6b6b;
            --accent-rgb: 255, 107, 107;
        }
        [data-theme="gold"] {
            --accent: #f0c040;
            --accent-rgb: 240, 192, 64;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at 20% 0%, rgba(var(--accent-rgb), 0.16), transparent 30rem),
                #08090d;
            color: #e6e6e6;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        }
        nav {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            padding: 1rem clamp(1rem, 4vw, 3rem);
            background: rgba(8, 9, 13, 0.84);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(14px);
        }
        .brand {
            color: var(--accent);
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-decoration: none;
        }
        .nav-actions {
            display: flex;
            align-items: center;
            gap: 1.25rem;
        }
        .home-link {
            color: #b8b8c2;
            font-size: 0.92rem;
            text-decoration: none;
        }
        .home-link:hover {
            color: var(--accent);
        }
        .theme-dots {
            display: flex;
            gap: 0.42rem;
        }
        .theme-dot {
            width: 18px;
            height: 18px;
            border: 2px solid transparent;
            border-radius: 50%;
            cursor: pointer;
        }
        .theme-dot.active {
            border-color: rgba(255, 255, 255, 0.72);
        }
        main {
            width: min(900px, calc(100% - 2rem));
            margin: 0 auto;
            padding: clamp(3rem, 8vw, 6rem) 0;
        }
        h1 {
            margin: 0 0 0.75rem;
            color: var(--accent);
            font-size: clamp(2.4rem, 8vw, 5rem);
            line-height: 1;
        }
        .lede {
            max-width: 620px;
            margin: 0 0 3rem;
            color: #aaaab4;
            font-size: 1.08rem;
            line-height: 1.7;
        }
        .post-list {
            display: grid;
            gap: 1rem;
        }
        .post-card {
            display: block;
            padding: 1.35rem;
            background: rgba(255, 255, 255, 0.045);
            border: 1px solid rgba(var(--accent-rgb), 0.22);
            border-radius: 8px;
            color: inherit;
            text-decoration: none;
            transition: border-color 0.2s, transform 0.2s, background 0.2s;
        }
        .post-card:hover {
            background: rgba(var(--accent-rgb), 0.075);
            border-color: rgba(var(--accent-rgb), 0.48);
            transform: translateY(-2px);
        }
        .post-card h2 {
            margin: 0 0 0.5rem;
            color: #f4f4f6;
            font-size: 1.35rem;
            line-height: 1.25;
        }
        .post-meta {
            margin: 0 0 0.65rem;
            color: var(--accent);
            font-size: 0.84rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .post-card p {
            margin: 0;
            color: #a7a7b0;
            line-height: 1.6;
        }
        .empty {
            padding: 1.25rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #aaaab4;
        }
        @media (max-width: 640px) {
            nav {
                align-items: flex-start;
                flex-direction: column;
            }
            .nav-actions {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>
    <nav aria-label="Blog navigation">
        <a class="brand" href="/blog">BLOG</a>
        <div class="nav-actions">
            <div class="theme-dots" id="theme-dots" aria-label="Theme colors">
                <span class="theme-dot" data-theme="white" style="background:#ffffff"></span>
                <span class="theme-dot active" data-theme="blue" style="background:#4a9eff"></span>
                <span class="theme-dot" data-theme="green" style="background:#4ae0a0"></span>
                <span class="theme-dot" data-theme="purple" style="background:#a78bfa"></span>
                <span class="theme-dot" data-theme="red" style="background:#ff6b6b"></span>
                <span class="theme-dot" data-theme="gold" style="background:#f0c040"></span>
            </div>
            <a class="home-link" href="/">Main Site</a>
        </div>
    </nav>
    <main>
        <h1>Blog</h1>
        <p class="lede">Writing about software, small business websites, and the practical side of building things for the web.</p>
        <div class="post-list">
            {{if .Posts}}
                {{range .Posts}}
                    <a class="post-card" href="/blog/{{.Slug}}">
                        {{if .Date}}<div class="post-meta">{{.Date}}</div>{{end}}
                        <h2>{{.Title}}</h2>
                        {{if .Description}}<p>{{.Description}}</p>{{end}}
                    </a>
                {{end}}
            {{else}}
                <div class="empty">No posts yet.</div>
            {{end}}
        </div>
    </main>
    <script>
        const themeColors = {
            white: true,
            blue: true,
            green: true,
            purple: true,
            red: true,
            gold: true,
        };
        const dots = document.querySelectorAll('.theme-dot');
        const saved = localStorage.getItem('theme');
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            dots.forEach(dot => dot.classList.toggle('active', dot.dataset.theme === theme));
        }
        setTheme((saved && themeColors[saved]) ? saved : 'blue');
        dots.forEach(dot => dot.addEventListener('click', () => setTheme(dot.dataset.theme)));
    </script>
</body>
</html>
