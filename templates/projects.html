<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bg: '#0a0a0a',
                        panel: '#111111',
                        border: '#222222',
                        primary: '#ff6b6b',
                        secondary: '#ff6b6b',
                        accent: '#2dd4bf',
                        dim: '#555555',
                        text: '#e0e0e0',
                        muted: '#888888',
                    },
                    fontFamily: {
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    boxShadow: {
                        'glow': '0 0 20px rgba(0, 255, 157, 0.15)',
                        'glow-sm': '0 0 10px rgba(0, 255, 157, 0.1)',
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'JetBrains Mono', monospace; }
        .cursor-blink { animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        .scan-line {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: rgba(0, 255, 157, 0.1);
            animation: scan 4s linear infinite;
            pointer-events: none;
        }
        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        .matrix-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.03;
            z-index: 0;
        }
        .grid-bg {
            background-image: 
                linear-gradient(rgba(0, 255, 157, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 157, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        .panel-hover:hover {
            box-shadow: 0 0 15px rgba(0, 255, 157, 0.1);
            border-color: #ff6b6b;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #ff6b6b; }
    </style>
</head>
<body class="bg-[#0a0a0a] text-[#e0e0e0] min-h-screen antialiased selection:bg-[#ff6b6b] selection:text-[#0a0a0a]">
    <canvas id="matrix" class="matrix-rain"></canvas>
    <div class="scan-line"></div>

    {{template "navbar" .}}

    <main class="pt-20 pb-16 px-4 relative z-10 grid-bg min-h-screen">
        <div class="max-w-6xl mx-auto">
            <div class="flex items-center gap-2 text-xs text-[#555] mb-8">
                <span>~/</span>
                <span class="text-[#ff6b6b]">projects</span>
                <span class="cursor-blink">_</span>
            </div>

            <div class="space-y-6">
                <div class="grid md:grid-cols-2 gap-4">
                    {{range .Projects}}
                    <a href="/project/{{.Slug}}" class="bg-[#111] border border-[#222] rounded-lg p-5 panel-hover transition-all group">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-[#ff6b6b]">▸</span>
                            <h3 class="text-lg font-semibold text-[#e0e0e0] group-hover:text-[#ff6b6b] transition-colors">{{.Name}}</h3>
                        </div>
                        {{if .Description}}
                        <p class="text-xs text-[#555] mt-2">{{.Description}}</p>
                        {{end}}
                        <p class="text-xs text-[#2dd4bf] mt-3">github.com/{{$.GitHubUser}}/{{.Slug}}</p>
                    </a>
                    {{end}}
                </div>
            </div>
        </div>
    </main>

    <footer class="border-t border-[#222] py-6 mt-12 bg-[#0a0a0a]">
        <div class="max-w-6xl mx-auto px-4 text-center">
            <p class="text-xs text-[#555]">
                <span class="text-[#ff6b6b]">© 2026</span> Phillip England 
                <span class="text-[#333] mx-2">|</span> 
                <span class="text-[#555]">Built with</span> 
                <span class="text-[#2dd4bf]">Go</span> 
                <span class="text-[#555]">+</span> 
                <span class="text-[#ff6b6b]">Tailwind</span>
            </p>
        </div>
    </footer>

    <script src="/static/site.js" defer></script>
    <script>
        (function(){
            const canvas = document.getElementById('matrix');
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
            const fontSize = 14;
            const columns = canvas.width / fontSize;
            const drops = Array(Math.floor(columns)).fill(1);
            function draw() {
                ctx.fillStyle = 'rgba(10, 10, 10, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff6b6b';
                ctx.font = fontSize + 'px monospace';
                for(let i = 0; i < drops.length; i++) {
                    const char = chars[Math.floor(Math.random() * chars.length)];
                    ctx.fillText(char, i * fontSize, drops[i] * fontSize);
                    if(drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                }
            }
            setInterval(draw, 50);
            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });
        })();
    </script>
</body>
</html>
